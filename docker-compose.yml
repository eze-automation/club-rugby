services:
  db:
    image: postgres:16-alpine
    container_name: club-rugby-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rugby
      POSTGRES_PASSWORD: rugby123
      POSTGRES_DB: clubrugby
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
